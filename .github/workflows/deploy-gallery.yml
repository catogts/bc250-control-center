name: Deploy screenshot gallery

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/gallery/**
      - assets/screenshots/**
      - .github/workflows/deploy-gallery.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on its first deployment instead of assuming
          # it already exists in repository settings.
          enablement: true

      - name: Build gallery artifact
        run: |
          mkdir -p _site/gallery _site/assets/screenshots
          cp assets/gallery/index.html _site/gallery/index.html
          # Every picture in assets/screenshots is published and listed in
          # photos.json, which the page reads: adding a file to the folder is
          # all a new screenshot needs. Captions and order live in the page.
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          source = pathlib.Path("assets/screenshots")
          target = pathlib.Path("_site/assets/screenshots")
          files = sorted(
              path.name for path in source.iterdir()
              if path.is_file() and path.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"}
          )
          for name in files:
              shutil.copy2(source / name, target / name)
          pathlib.Path("_site/gallery/photos.json").write_text(json.dumps(files, indent=1) + "\n")
          print("Published", len(files), "screenshots:", ", ".join(files))
          PY
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
