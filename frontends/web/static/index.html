<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BC-250 Control Center - Web</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:20px;background:#0b0f14;color:#e6edf3;font-family:system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:12px;color:#8b98a5;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:#151b23;border:1px solid #263140;border-radius:12px;padding:14px 16px;min-width:140px}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8b98a5}
.value{font-size:28px;font-weight:700;margin-top:4px}
.unit{font-size:12px;color:#8b98a5;margin-left:3px}
.ok{color:#3fb950}.warn{color:#d29922}.bad{color:#f85149}
section{margin-top:18px}
h2{font-size:13px;color:#8b98a5;text-transform:uppercase;letter-spacing:.06em}
table{border-collapse:collapse;font-size:13px;width:100%;max-width:760px}
td,th{border-bottom:1px solid #263140;padding:6px 8px;text-align:left}
footer{margin-top:20px;font-size:11px;color:#6e7681}
input{background:#0d1117;border:1px solid #263140;color:#e6edf3;border-radius:8px;padding:6px 8px;font-size:12px;width:220px}
button{background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<h1>BC-250 Control Center</h1>
<div class="sub">web frontend (phase 1, read-only) · <span id="upd">--</span></div>
<div class="row" id="tiles"></div>
<section><h2>Fans</h2><div id="fans">--</div></section>
<section><h2>System</h2><div id="system">--</div></section>
<footer>token: <input id="token" type="password" placeholder="BC250_WEB_TOKEN (비우면 로컬 무인증)"> <button onclick="saveToken()">저장</button></footer>
<script>
function authQS(){const t=localStorage.getItem('bc250token')||'';return t?('?token='+encodeURIComponent(t)):'';}
function tok(){return localStorage.getItem('bc250token')||'';}
async function postFan(body){
  const r=await fetch('/api/fan'+authQS(),{method:'POST',headers:{'Content-Type':'application/json','X-Auth':tok()},body:JSON.stringify(body)});
  const d=await r.json(); alert(d.ok?('적용됨: '+d.detail):('실패: '+d.detail)); loadFans();
}
async function loadFans(){
  try{
    const f=await get('fans');const chs=f.channels||[];
    if(!chs.length){document.getElementById('fans').textContent='nct668 센서 없음';return;}
    let h='<table><tr><th>ch</th><th>label</th><th>duty</th><th>RPM</th><th>enable</th>'+(f.write_enabled?'<th>control</th>':'')+'</tr>';
    for(const c of chs){
      const ctl=f.write_enabled?`<td><input type="range" min="0" max="255" value="${c.duty??127}" id="s${c.channel}" style="width:110px"> <button onclick="postFan({op:'set',channel:${c.channel},value:+document.getElementById('s${c.channel}').value})" >SET</button> <button onclick="if(confirm('ch${c.channel} 자동 모드로 되돌립니다'))postFan({op:'auto',channel:${c.channel}})">AUTO</button></td>`:'';
      h+=`<tr><td>${c.channel}</td><td>${c.label||''}</td><td>${c.duty??'--'} (${Math.round((c.duty??0)/2.55)}%)</td><td>${c.rpm??'--'}</td><td>${c.enable??'--'}</td>${ctl}</tr>`;
    }
    h+='</table>';
    if(!f.write_enabled)h+='<div style="font-size:11px;color:#8b98a5;margin-top:6px">쓰기 비활성 (서버 BC250_WEB_ENABLE_WRITE=1 필요)</div>';
    document.getElementById('fans').innerHTML=h;
  }catch(e){document.getElementById('fans').textContent='fans 오류: '+e;}
}
function saveToken(){localStorage.setItem('bc250token',document.getElementById('token').value.trim());tick();}
async function get(cmd){const r=await fetch('/api/'+cmd+authQS());return await r.json();}
function tile(label,value,unit,cls){return `<div class="card"><div class="label">${label}</div><div class="value ${cls||''}">${value}<span class="unit">${unit||''}</span></div></div>`;}
async function tick(){
  try{
    const d=await get('telemetry');const m=d.metrics||{};
    const cell=(l,k)=>{const x=m[k]||{};const v=(x.value==null)?'--':x.value;const c=x.status==='valid'?'ok':(x.status?'warn':'bad');return tile(l,v,x.unit,c);};
    document.getElementById('tiles').innerHTML=cell('GPU (sclk)','sclk')+cell('VRAM (mclk)','mclk')+cell('온도','temperature')+cell('전압','voltage')+tile('상태',d.status||'?',null,d.status==='ok'?'ok':'warn');
    const s=await get('system');
    document.getElementById('system').innerHTML=`<code style="font-size:11px;word-break:break-all">${JSON.stringify(s).slice(0,400)}</code>`;
    document.getElementById('upd').textContent=new Date().toLocaleTimeString()+' 갱신';
  }catch(e){document.getElementById('upd').textContent='오류: '+e;}
}
tick();loadFans();setInterval(()=>{tick();loadFans();},3000);
</script>
</body>
</html>
